name: CI

# Lint, build check and tests on every pull request. The site is static HTML with no build step and
# no dependencies, so "lint" and "build" are the dependency-free scripts in scripts/ (see README,
# "Checks on a pull request"). Vercel also builds a preview of each pull request.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"

# A new push to the same pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repository. It writes nothing and uses no secret.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # No `npm ci`: package.json has no dependencies and the repo has no lockfile, so there is
      # nothing to install. The page tests use the Google Chrome that ubuntu-latest already has.
      - run: npm run lint
      - run: npm run build
      - run: npm test
