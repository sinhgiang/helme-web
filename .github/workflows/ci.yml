name: CI

# Runs the tests on every pull request. The site is static HTML (no build step, Vercel already
# builds a preview of each pull request), so there is nothing to build here.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"

# A new push to the same pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repository. It writes nothing and uses no secret.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # No `npm ci`: package.json has no dependencies and the repo has no lockfile, so there is
      # nothing to install. The page tests use the Google Chrome that ubuntu-latest already has.
      - run: npm test
